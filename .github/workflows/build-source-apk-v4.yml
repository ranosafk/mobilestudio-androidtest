name: Build Mobile Studio source APK (API 36 fallback)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-source-apk-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out build workflow repository
        uses: actions/checkout@v4

      - name: Check out Mobile Studio source
        uses: actions/checkout@v4
        with:
          repository: fiowwwys/MobileStudio
          path: source

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Adapt SDK levels for available platform
        working-directory: source
        run: |
          sed -i 's/release(37)/release(36)/; s/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          grep -nE 'compileSdk|release\(36\)|targetSdk' app/build.gradle.kts

      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio-source-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
