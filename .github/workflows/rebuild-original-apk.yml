name: Rebuild Mobile Studio from original APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobilestudio_ver1-1.apk"
      - ".github/workflows/rebuild-original-apk.yml"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Apktool and Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip
          sdkmanager "build-tools;36.0.0" "platform-tools"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" \
            --output apktool.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar" | sha256sum --check
          java -jar apktool.jar --version

      - name: Validate and decode original APK
        shell: bash
        run: |
          set -euo pipefail
          test -s mobilestudio_ver1-1.apk
          unzip -tq mobilestudio_ver1-1.apk
          dex_count="$(unzip -Z1 mobilestudio_ver1-1.apk | grep -Ec '^classes([0-9]+)?\.dex$')"
          echo "Original DEX files: $dex_count"
          test "$dex_count" -eq 10
          java -jar apktool.jar d -f mobilestudio_ver1-1.apk -o decoded
          test -s decoded/AndroidManifest.xml
          test -s decoded/apktool.yml
          test -d decoded/smali

      - name: Apply Studio-style dark UI palette
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("decoded/smali_classes4/com/exampletest/mobilestudiotest/core/Theme.smali")
          source = path.read_text()
          anchor = 'const-string v3, "Dark"'
          start = source.index(anchor)
          end = source.index("invoke-direct/range {v2 .. v25}", start)
          block = source[start:end].replace(anchor, 'const-string v3, "Studio Dark"')
          palette = {
              "v5": "-0xe8e6e1",
              "v6": "-0xdfdbd5",
              "v7": "-0xd6d1ca",
              "v8": "-0xe8e5e0",
              "v9": "-0xdcd7d0",
              "v10": "-0xc5beb5",
              "v11": "-0x17120e",
              "v12": "-0x655a4f",
              "v13": "-0xff5d01",
              "v14": "-0xeca478",
              "v15": "-0xcfc6bb",
              "v16": "-0xe6e2dc",
              "v17": "-0xdad4cd",
              "v18": "-0xe8e4de",
              "v19": "-0xdfd8cf",
              "v20": "-0x19120d",
              "v21": "-0xa9632a",
              "v22": "-0x316e88",
              "v23": "-0x4a3158",
              "v24": "-0x9566ab",
              "v25": "-0xb13650",
          }
          for register, value in palette.items():
              pattern = rf"(?m)^(\s*)const(?:/16)?\s+{register},\s*[^\n]+$"
              block, count = re.subn(pattern, rf"\g<1>const {register}, {value}", block)
              if count != 1:
                  raise SystemExit(f"Expected one {register} color constant, found {count}")
          path.write_text(source[:start] + block + source[end:])
          print("Applied 21 Studio Dark theme colors.")
          PY

      - name: Refine mobile dock layout and touch targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dock = Path("decoded/smali_classes5/com/exampletest/mobilestudiotest/ui/DockLayout.smali")
          source = dock.read_text()

          replacements = [
              ("const/high16 v0, 0x435c0000    # 220.0f", "const/high16 v0, 0x43340000    # 180.0f"),
              ("const/high16 v0, 0x437a0000    # 250.0f", "const/high16 v0, 0x433e0000    # 190.0f"),
              ("const/high16 v0, 0x430c0000    # 140.0f", "const/high16 v0, 0x42f00000    # 120.0f"),
          ]

          for before, after in replacements:
              count = source.count(before)
              if count != 2:
                  raise SystemExit(f"Expected exactly 2 occurrences of {before}, found {count}")
              source = source.replace(before, after)

          dock.write_text(source)

          splitter = Path("decoded/smali_classes5/com/exampletest/mobilestudiotest/ui/Splitter.smali")
          source = splitter.read_text()
          before = "const/high16 v0, 0x41400000    # 12.0f"
          after = "const/high16 v0, 0x41800000    # 16.0f"
          if source.count(before) != 1:
              raise SystemExit("Unexpected splitter thickness implementation")
          splitter.write_text(source.replace(before, after))

          before = "const/high16 v3, 0x41400000    # 12.0f"
          after = "const/high16 v3, 0x41800000    # 16.0f"
          if source.count(before) != 0:
              raise SystemExit("Unexpected splitter source overlap")

          source = dock.read_text()
          before = "const/high16 v3, 0x41400000    # 12.0f"
          after = "const/high16 v3, 0x41800000    # 16.0f"
          if source.count(before) != 1:
              raise SystemExit("Unexpected panel grip width implementation")
          source = source.replace(before, after)
          before = "const/high16 v4, 0x41900000    # 18.0f"
          after = "const/high16 v4, 0x41b00000    # 22.0f"
          if source.count(before) != 1:
              raise SystemExit("Unexpected panel grip height implementation")
          source = source.replace(before, after)
          before = "const/high16 v4, 0x41d00000    # 26.0f"
          after = "const/high16 v4, 0x41f00000    # 30.0f"
          if source.count(before) != 2:
              raise SystemExit("Expected two panel header action buttons")
          source = source.replace(before, after)
          dock.write_text(source)
          print("Applied mobile dock sizing, 16dp resize targets, and larger panel controls.")
          PY

      - name: Rebuild, align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b decoded -o MobileStudio-rebuilt-unsigned.apk
          test -s MobileStudio-rebuilt-unsigned.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 MobileStudio-rebuilt-unsigned.apk MobileStudio-aligned.apk
          keytool -genkeypair -noprompt -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --out MobileStudio-rebuilt.apk MobileStudio-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs MobileStudio-rebuilt.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 MobileStudio-rebuilt.apk
          unzip -tq MobileStudio-rebuilt.apk
          rebuilt_dex_count="$(unzip -Z1 MobileStudio-rebuilt.apk | grep -Ec '^classes([0-9]+)?\.dex$')"
          echo "Rebuilt DEX files: $rebuilt_dex_count"
          test "$rebuilt_dex_count" -eq 10
          test "$(stat -c '%s' MobileStudio-rebuilt.apk)" -gt 1000000

      - name: Package decoded resources and smali for UI review
        shell: bash
        run: |
          set -euo pipefail
          zip -qr MobileStudio-decoded-resources.zip decoded/res decoded/AndroidManifest.xml decoded/apktool.yml
          zip -qr MobileStudio-smali.zip decoded/smali*

      - name: Decompile app code for UI review
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip" \
            --output jadx.zip
          echo "1755e4242ade71a077438723689f404079592ec7764a3a0572f98fef94ebcbf3  jadx.zip" | sha256sum --check
          unzip -q jadx.zip -d jadx-dist
          chmod +x jadx-dist/bin/jadx
          jadx-dist/bin/jadx --version
          set +e
          jadx-dist/bin/jadx --no-res --show-bad-code -d jadx-out mobilestudio_ver1-1.apk
          jadx_status=$?
          set -e
          if [ "$jadx_status" -ne 0 ] && [ "$jadx_status" -ne 3 ]; then
            echo "JADX failed with unexpected exit code: $jadx_status"
            exit "$jadx_status"
          fi
          test -d jadx-out/sources
          grep -R -n -E 'class MainActivity|class StudioApp' jadx-out/sources > jadx-main-classes.txt || true
          zip -qr MobileStudio-decompiled-source.zip jadx-out/sources jadx-main-classes.txt

      - name: Upload rebuilt APK, resources, and decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: mobilestudio-rebuild-and-analysis
          path: |
            MobileStudio-rebuilt.apk
            MobileStudio-decoded-resources.zip
            MobileStudio-smali.zip
            MobileStudio-decompiled-source.zip
          if-no-files-found: error
          retention-days: 30
