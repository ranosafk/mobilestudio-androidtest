name: Build Mobile Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MobileStudio_Recovered_Project.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37 SDK and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"

      - name: Extract recovered project
        run: |
          test -f MobileStudio_Recovered_Project.zip
          unzip -q MobileStudio_Recovered_Project.zip -d .
          test -f MobileStudio_Android_Project/settings.gradle
          test -f MobileStudio_Android_Project/app/build.gradle

      - name: Build debug APK
        working-directory: MobileStudio_Android_Project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../build.log

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilestudio-apk-and-build-logs
          path: |
            MobileStudio_Android_Project/app/build/outputs/apk/debug/*.apk
            build.log
            MobileStudio_Android_Project/BUILD_README.md
            MobileStudio_Android_Project/UPGRADE_AUDIT_ORIGINAL.md
            MobileStudio_Android_Project/recovery-reference/FAILED_METHODS_INDEX.md
          if-no-files-found: warn
          retention-days: 30
