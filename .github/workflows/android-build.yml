name: Build Mobile Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - "inspect/recovered-project"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK and build tools
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"

      - name: Extract recovered project
        run: |
          test -f MobileStudio_Recovered_Project.zip
          unzip -q MobileStudio_Recovered_Project.zip -d .
          test -f MobileStudio_Android_Project/settings.gradle
          test -f MobileStudio_Android_Project/app/build.gradle
          grep -n 'compileSdk' MobileStudio_Android_Project/app/build.gradle

      - name: Apply mobile viewport graphics defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("MobileStudio_Android_Project/app/src/main/java/com/exampletest/mobilestudiotest/ui/ViewportView.java")
          source = p.read_text()
          old = "EGLConfig c = chooseConfig$pick(egl, display, 4, 24);"
          new = "EGLConfig c = chooseConfig$pick(egl, display, 0, 16);"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected one EGL config selection, found {count}; refusing unsafe patch")
          p.write_text(source.replace(old, new, 1))
          print("Viewport now prefers 0x MSAA with a 16-bit depth buffer; original fallback ladder remains intact.")
          PY
          grep -n "EGLConfig c = chooseConfig" MobileStudio_Android_Project/app/src/main/java/com/exampletest/mobilestudiotest/ui/ViewportView.java

      - name: Build debug APK
        working-directory: MobileStudio_Android_Project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../build.log

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilestudio-apk-and-build-logs
          path: |
            MobileStudio_Android_Project/app/build/outputs/apk/debug/*.apk
            build.log
            MobileStudio_Android_Project/BUILD_README.md
            MobileStudio_Android_Project/UPGRADE_AUDIT_ORIGINAL.md
            MobileStudio_Android_Project/recovery-reference/FAILED_METHODS_INDEX.md
          if-no-files-found: warn
          retention-days: 30
