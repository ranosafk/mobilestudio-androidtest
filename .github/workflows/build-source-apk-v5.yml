name: Build Mobile Studio source APK (Android 37)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-source-apk-v5.yml"
      - "overrides/StartScreen.kt"
      - "overrides/MainActivity.kt"
      - "overrides/ViewportView.kt"
      - "overrides/DockLayout.kt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out build workflow repository
        uses: actions/checkout@v4

      - name: Check out Mobile Studio source
        uses: actions/checkout@v4
        with:
          repository: fiowwwys/MobileStudio
          path: source

      - name: Apply UI and background-rendering optimizations
        run: |
          cp overrides/StartScreen.kt source/app/src/main/java/com/exampletest/mobilestudiotest/ui/StartScreen.kt
          cp overrides/MainActivity.kt source/app/src/main/java/com/exampletest/mobilestudiotest/MainActivity.kt
          cp overrides/ViewportView.kt source/app/src/main/java/com/exampletest/mobilestudiotest/ui/ViewportView.kt
          cp overrides/DockLayout.kt source/app/src/main/java/com/exampletest/mobilestudiotest/ui/DockLayout.kt

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android API 37 platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          ls -la "$ANDROID_HOME/platforms"

      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio-source-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
